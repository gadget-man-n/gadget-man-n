    <style>

      body {

        color: var(--ink);
        background:

          "Yu Gothic", "Meiryo", sans-serif;

      }

      a {
        color: inherit;
        text-decoration: none;
      }

      }

      .page {
        width: min(100%, 760px);

      }

      .profile {
        position: relative;
        overflow: hidden;
        border-radius: 0 0 28px 28px;
        margin: -20px -16px 0;
        padding: 26px 18px 20px;

          linear-gradient(132deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.08)),
          linear-gradient(135deg, rgba(11, 31, 58, 0.93) 0%, rgba(0, 113, 227, 0.88) 58%, rgba(63, 182, 255, 0.78) 100%);

        backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow);

      .profile::after {
        content: "";

        inset: 0;
        background: linear-gradient(120deg, rgba(255, 255, 255, 0.18), transparent 45%, rgba(255, 255, 255, 0.1));
        pointer-events: none;
      }

      .profile-inner {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 104px 1fr;
        gap: 16px;
        align-items: center;

        width: 104px;
        aspect-ratio: 1;
        border: 4px solid rgba(255, 255, 255, 0.84);
        border-radius: 24px;
        object-fit: cover;
        box-shadow: 0 18px 42px rgba(6, 21, 57, 0.28);
      }

      h1 {

        white-space: nowrap;

        margin: 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: 14px;
        line-height: 1.8;
      }

        z-index: 1;

        align-items: center;
        gap: 8px 10px;

        max-width: 100%;
        min-height: 48px;
        margin-top: 18px;
        padding: 10px 13px;
        border: 1px solid rgba(255, 255, 255, 0.66);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
        color: var(--blue-dark);
        backdrop-filter: var(--glass-blur);
        box-shadow: 0 14px 30px rgba(6, 21, 57, 0.18);

      .work-link span {

        font-size: 13px;
        line-height: 1.35;

        height: 42px;

        color: #fff;

        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.28);
      }

      .social-link svg {

        inset: 0;
        background: linear-gradient(115deg, transparent, rgba(246, 200, 95, 0.16) 62%, rgba(255, 255, 255, 0.18));
        pointer-events: none;
      }

        position: absolute;
        top: 21px;
        right: 16px;
        z-index: 1;
        height: 28px;
        width: auto;
        filter: brightness(0) invert(1);

        padding: 0 16px;

        border: 1px solid rgba(255, 255, 255, 0.72);
        background: rgba(255, 255, 255, 0.82);
        color: var(--blue-dark);

          name: "cocopar モバイルモニター zs-156x",
          category: "desk",
          categories: ["desk"],
          icon: "C",
          postedAt: "2026-01-21",
          price: "¥13,979",
          desc: "ノートPCやゲーム機の画面を増やせる、持ち運び向けモニター。",
          links: [{ url: "https://amzn.to/4puGbiX" }, { url: "https://a.r10.to/hRTOVl" }],
          thumbnail: "thumbnails/zs-156x.jpg",
          youtube: "https://www.youtube.com/shorts/Tj0LwjEuctM",
        },
        {
          name: "SANWA SUPPLY 電源タップ 700-TAP083",
          category: "charger",
          categories: ["charger", "desk"],
          icon: "S",
          postedAt: "2026-01-06",
          price: "-",
          desc: "デスク上の充電器やPC周辺機器をまとめやすい電源タップ。",
          links: [{ url: "https://amzn.to/44X9ymO" }, { url: "https://a.r10.to/h5GK0K" }],
          thumbnail: "thumbnails/700-tap083.jpg",
          youtube: "https://www.youtube.com/shorts/F_0q4YkuDZI",
        },
      ];

      const categoryLabels = Object.fromEntries(categories.map((category) => [category.id, category.label]));
      const categoryTitles = {
        coupon: "🉐おトクなクーポン発行中",
        crowdfunding: "クラウドファンディング実施中",
        iphone: "iPhone関連",
        ipad: "iPad関連",
        applewatch: "Apple Watch関連",
        mac: "Mac･PC関連",
        powerbank: "モバイルバッテリー",
        earphone: "イヤホン",
        all: "すべてのアイテム",
      };
      const tabs = document.querySelector("#tabs");
      const grid = document.querySelector("#itemGrid");
      const input = document.querySelector("#searchInput");
      const itemCount = document.querySelector("#itemCount");
      const emptyState = document.querySelector("#emptyState");
      const title = document.querySelector("#itemsTitle");
      let activeCategory = "recent";

      // 投稿日（postedAt）の新しい順に並べて、上から10件を「直近紹介」にする
      const RECENT_COUNT = 10;
      const recentItems = new Set(
        [...items].sort((a, b) => b.postedAt.localeCompare(a.postedAt)).slice(0, RECENT_COUNT),
      );

      // 「7/10紹介」のようなバッジ表記を投稿日から自動で作る
      function postBadge(item) {
        if (item.badge) return item.badge;
        const [, month, day] = item.postedAt.split("-");
        return `${Number(month)}/${Number(day)}紹介`;
      }

      function couponIsActive(item) {
        if (!item.coupon || item.couponActive === false) return false;
        if (item.couponExpires && Date.now() > new Date(item.couponExpires).getTime()) return false;
        return true;
      }

      function crowdfundingIsActive(item) {
        if (item.crowdfundingActive === false) return false;
        if (item.crowdfundingExpires && Date.now() > new Date(item.crowdfundingExpires).getTime()) return false;
        return item.categories?.includes("crowdfunding");
      }

      function renderTabs() {
        const visibleCategories = categories.filter((category) => {
          if (category.id === "coupon") return items.some(couponIsActive);
          if (category.id === "crowdfunding") return items.some(crowdfundingIsActive);
          return true;
        });

        tabs.innerHTML = visibleCategories
          .map(
            (category) => `
              <button
                class="tab"
                type="button"
                role="tab"
                aria-selected="${category.id === activeCategory}"
                tabindex="${category.id === activeCategory ? 0 : -1}"
                data-category="${category.id}"
              >${category.label}</button>
            `,
          )
          .join("");
      }

      function getFilteredItems() {
        const keyword = input.value.trim().toLowerCase();
        return [...items]
          .sort((a, b) => b.postedAt.localeCompare(a.postedAt))
          .filter((item) => {
          const categoryMatch =
            activeCategory === "all" ||
            (activeCategory === "recent" && recentItems.has(item)) ||
            (activeCategory === "coupon" && couponIsActive(item)) ||
            (activeCategory === "crowdfunding" && crowdfundingIsActive(item)) ||
            (!["coupon", "crowdfunding"].includes(activeCategory) && item.categories?.includes(activeCategory));
          const text =
            `${item.name} ${item.desc} ${couponIsActive(item) ? item.coupon : ""} ${item.note || ""} ${postBadge(item)} ${categoryLabels[item.category]} ${(item.categories || []).map((category) => categoryLabels[category] || category).join(" ")}`.toLowerCase();
          return categoryMatch && (!keyword || text.includes(keyword));
          });
      }

      function getThumbnailSrc(item) {
        if (item.thumbnail) return item.thumbnail;
        const fallbackUrl = item.links?.[0]?.url;
        if (!fallbackUrl || fallbackUrl === "#") return "";
        return `https://api.microlink.io/?url=${encodeURIComponent(fallbackUrl)}&screenshot=true&embed=screenshot.url`;
      }

      function getLinkLabel(url) {
        let host = "";
        try {
          host = new URL(url).hostname;
        } catch {
          return "商品をチェック";
        }
        if (host.includes("amzn.to") || host.includes("amazon")) return "Amazonでチェック";
        if (host.includes("r10.to") || host.includes("rakuten")) return "楽天市場でチェック";
        if (host.includes("makuake.com")) return "Makuakeで見る";
        if (host.includes("greenfunding.jp")) return "GREEN FUNDINGで見る";
        return "公式サイトを見る";
      }

      function renderItems() {
        const filteredItems = getFilteredItems();
        title.textContent =
          activeCategory === "recent"
            ? "直近紹介アイテム"
            : categoryTitles[activeCategory] || `${categoryLabels[activeCategory]}アイテム`;
        itemCount.textContent = `${filteredItems.length}件`;
        emptyState.style.display = filteredItems.length ? "none" : "block";
        grid.innerHTML = filteredItems
          .map(
            (item) => {
              const thumbnail = getThumbnailSrc(item);
              const categoryBadges = (item.categories || [item.category])
                .filter((category) => category !== "coupon" || couponIsActive(item))
                .filter((category) => category !== "crowdfunding" || crowdfundingIsActive(item))
                .map((category) => categoryLabels[category] || category)
                .filter((label, index, labels) => label !== item.badge && labels.indexOf(label) === index)
                .map((label) => `<span class="badge">${label}</span>`)
                .join("");
              return `
              <article class="card">
                <div class="item-media">
                  <div class="thumb" aria-hidden="true">
                    ${
                      thumbnail
                        ? `<img src="${thumbnail}" alt="" width="84" height="84" loading="lazy" onerror="this.replaceWith(document.createTextNode('${item.icon}'))">`
                        : item.icon
                    }
                  </div>
                  ${
                    item.youtube
                      ? `<a class="yt-btn" href="${item.youtube}" target="_blank" rel="noopener" aria-label="${item.name}の紹介動画をYouTubeで見る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 16.5v-9l8 4.5-8 4.5Z"/></svg>YouTube</a>`
                      : ""
                  }
                  ${
                    couponIsActive(item) && item.couponCode
                      ? `<button class="coupon-copy" type="button" data-code="${item.couponCode}" aria-label="${item.name}のクーポンコード ${item.couponCode} をコピー">
                          <span>${item.couponCode}</span>
                          <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="9" y="9" width="10" height="10" rx="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1" />
                          </svg>
                        </button>`
                      : ""
                  }
                </div>
                <div class="item-main">
                  <div class="item-top">
                    <span class="badge ${item.badgeType || ""}">${postBadge(item)}</span>
                    ${categoryBadges}
                  </div>
                  <h3 class="item-name">${item.name}</h3>
                  <p class="item-desc">${item.desc}</p>
                  ${couponIsActive(item) ? `<p class="coupon-note">${item.coupon}</p>` : ""}
                  ${item.note ? `<p class="coupon-note">${item.note}</p>` : ""}
                  <div class="item-actions">
                    ${(item.links || [])
                      .map(
                        (link) =>
                          `<a class="buy" href="${link.url}" target="_blank" rel="noopener">${link.label || getLinkLabel(link.url)}</a>`,
                      )
                      .join("")}
                  </div>
                </div>
              </article>
            `;
            },
          )
          .join("");
        applyMasonry();
      }

      // カードの高さを内容に合わせる（2列表示のときだけ）。
      // 1px刻みのグリッド行を、カードの実際の高さ＋間隔ぶんまたがせて、
      // 左右の列がそれぞれ詰めて積み上がるようにする
      const MASONRY_GAP = 12;
      const twoColumnLayout = window.matchMedia("(min-width: 640px)");
      function applyMasonry() {
        const cards = [...grid.children];
        if (!twoColumnLayout.matches) {
          cards.forEach((card) => {
            card.style.gridRowEnd = "";
          });
          return;
        }
        cards.forEach((card) => {
          card.style.gridRowEnd = "auto";
        });
        const spans = cards.map((card) => Math.ceil(card.getBoundingClientRect().height) + MASONRY_GAP);
        cards.forEach((card, index) => {
          card.style.gridRowEnd = `span ${spans[index]}`;
        });
      }

      let masonryTimer;
      window.addEventListener("resize", () => {
        clearTimeout(masonryTimer);
        masonryTimer = setTimeout(applyMasonry, 120);
      });
      twoColumnLayout.addEventListener?.("change", applyMasonry);
      document.fonts?.ready?.then(applyMasonry);
      window.addEventListener("load", applyMasonry);
      // resizeイベントが飛ばない環境でも、グリッドの幅が変わったら組み直す
      let lastGridWidth = 0;
      new ResizeObserver((entries) => {
        const width = Math.round(entries[0].contentRect.width);
        if (width === lastGridWidth) return;
        lastGridWidth = width;
        applyMasonry();
      }).observe(grid);

      tabs.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        renderTabs();
        renderItems();
      });

      tabs.addEventListener("keydown", (event) => {
        const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
        if (!keys.includes(event.key)) return;
        event.preventDefault();
        const index = categories.findIndex((category) => category.id === activeCategory);
        let nextIndex = index;
        if (event.key === "ArrowLeft") nextIndex = (index - 1 + categories.length) % categories.length;
        if (event.key === "ArrowRight") nextIndex = (index + 1) % categories.length;
        if (event.key === "Home") nextIndex = 0;
        if (event.key === "End") nextIndex = categories.length - 1;
        activeCategory = categories[nextIndex].id;
        renderTabs();
        renderItems();
        tabs.querySelector('[aria-selected="true"]')?.focus();
      });

      input.addEventListener("input", () => {
        if (input.value.trim() && activeCategory !== "all") {
          activeCategory = "all";
          renderTabs();
        }
        renderItems();
      });

      grid.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-code]");
        if (!button) return;
        const code = button.dataset.code;
        const originalLabel = button.getAttribute("aria-label");
        try {
          await navigator.clipboard.writeText(code);
          button.classList.add("is-copied");
          button.setAttribute("aria-label", `${code} をコピーしました`);
        } catch {
          button.setAttribute("aria-label", `${code} を長押しでコピーしてください`);
        }
        setTimeout(() => {
          button.classList.remove("is-copied");
          button.setAttribute("aria-label", originalLabel);
        }, 2000);
      });

      renderTabs();
      renderItems();

      const moftCopy = document.querySelector("#moftCopy");
      const moftCopyHint = document.querySelector("#moftCopyHint");
      moftCopy?.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText("man2026");
          moftCopyHint.textContent = "コピーしました！";
        } catch {
          moftCopyHint.textContent = "長押しでコピーしてください";
        }
        setTimeout(() => {
          moftCopyHint.textContent = "タップでコピー";
        }, 2000);
      });
    </script>
  </body>
</html>
