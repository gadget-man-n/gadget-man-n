<style>
:root{
  color-scheme: light dark;
  --bg:#E8EDF6;
  --ink:#0D1222; --ink-2:rgba(13,18,34,.64); --ink-3:rgba(13,18,34,.42);
  --fill:rgba(255,255,255,.34); --fill-2:rgba(255,255,255,.58); --fill-3:rgba(255,255,255,.84);
  --rim-hi:rgba(255,255,255,.95); --rim-lo:rgba(255,255,255,.32); --edge:rgba(255,255,255,.55);
  --drop:0 0 0 .5px rgba(20,30,60,.08), 0 1px 1px rgba(20,30,60,.05), 0 14px 34px -12px rgba(20,30,60,.28);
  --blue:#0A7CFF; --amber:#FF9F0A; --amber-ink:#B25E00; --hot:#E5281E; --violet:#A24BD6; --green:#28B84E;
  --b1:#62C9FF; --b2:#A393FF; --b3:#FF9CC2; --b4:#FFD46E;
  --sk:rgba(255,255,255,.5); --sk-hi:rgba(255,255,255,.95);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --soft:cubic-bezier(.3,1.25,.5,1);
  --out:cubic-bezier(.2,.8,.2,1);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070A14;
    --ink:#F3F5FF; --ink-2:rgba(243,245,255,.68); --ink-3:rgba(243,245,255,.44);
    --fill:rgba(28,32,50,.40); --fill-2:rgba(44,50,76,.52); --fill-3:rgba(70,78,110,.62);
    --rim-hi:rgba(255,255,255,.34); --rim-lo:rgba(255,255,255,.06); --edge:rgba(255,255,255,.12);
    --drop:0 14px 34px -12px rgba(0,0,0,.7);
    --blue:#4AA3FF; --amber-ink:#FFB340; --hot:#FF6B5E;
    --b1:#0D5BD6; --b2:#5B3FD0; --b3:#B0306E; --b4:#B0761A;
    --sk:rgba(255,255,255,.07); --sk-hi:rgba(255,255,255,.18);
  }
}
:root[data-theme="dark"]{
  --bg:#070A14;
  --ink:#F3F5FF; --ink-2:rgba(243,245,255,.68); --ink-3:rgba(243,245,255,.44);
  --fill:rgba(28,32,50,.40); --fill-2:rgba(44,50,76,.52); --fill-3:rgba(70,78,110,.62);
  --rim-hi:rgba(255,255,255,.34); --rim-lo:rgba(255,255,255,.06); --edge:rgba(255,255,255,.12);
  --drop:0 14px 34px -12px rgba(0,0,0,.7);
  --blue:#4AA3FF; --amber-ink:#FFB340; --hot:#FF6B5E;
  --b1:#0D5BD6; --b2:#5B3FD0; --b3:#B0306E; --b4:#B0761A;
  --sk:rgba(255,255,255,.07); --sk-hi:rgba(255,255,255,.18);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked body{overflow:hidden}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink); overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; cursor:pointer; -webkit-user-select:none; user-select:none}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:3px}
img{display:block}

/* ---------- 背景（ガラスが映り込む色） ---------- */
.bg{position:fixed; inset:-12%; z-index:-1; overflow:hidden; pointer-events:none}
.bg i{position:absolute; width:72vmax; height:72vmax; border-radius:50%; opacity:.8; animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){background:radial-gradient(closest-side,var(--b1),transparent); left:-22vmax; top:-14vmax}
.bg i:nth-child(2){background:radial-gradient(closest-side,var(--b2),transparent); right:-28vmax; top:18vh; animation-duration:31s; animation-delay:-9s}
.bg i:nth-child(3){background:radial-gradient(closest-side,var(--b3),transparent); left:4vw; bottom:-34vmax; animation-duration:35s; animation-delay:-4s}
.bg i:nth-child(4){background:radial-gradient(closest-side,var(--b4),transparent); right:-14vmax; bottom:2vh; width:48vmax; height:48vmax; animation-duration:28s; animation-delay:-14s}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(7vmax,-5vmax,0) scale(1.14)}
  100%{transform:translate3d(-6vmax,6vmax,0) scale(.94)}
}

/* ---------- Liquid Glass ---------- */
.glass,.pane{position:relative; isolation:isolate}
.glass{
  background:linear-gradient(160deg,var(--fill-2),var(--fill) 60%);
  -webkit-backdrop-filter:blur(22px) saturate(190%);
  backdrop-filter:blur(22px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--rim-hi), inset 0 -1px 0 var(--rim-lo), inset 0 0 0 .5px var(--edge), var(--drop);
}
.pane{
  background:linear-gradient(160deg,var(--fill-2),var(--fill) 70%);
  box-shadow:inset 0 1px 0 var(--rim-hi), inset 0 0 0 .5px var(--edge), var(--drop);
}
.glass::before,.pane::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.2px; pointer-events:none; z-index:3;
  background:linear-gradient(135deg,var(--rim-hi),transparent 32%,transparent 66%,var(--rim-hi));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; opacity:.75;
}
.glass::after,.pane::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:3;
  background:radial-gradient(140px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.42),transparent 62%);
  opacity:0; transition:opacity .4s;
}
.lit::after{opacity:1}
.glass.dark{
  background:linear-gradient(160deg,rgba(30,30,40,.30),rgba(20,20,30,.18));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 0 0 .5px rgba(255,255,255,.22), 0 8px 24px -10px rgba(0,0,0,.5);
  color:#fff;
}

/* 押したときのぷるっと感と波紋 */
.press{transition:transform .5s var(--spring); overflow:hidden}
.press:active{transform:scale(.965); transition-duration:.12s}
.rip{position:absolute; width:12px; height:12px; margin:-6px; border-radius:50%; pointer-events:none; z-index:4;
  background:radial-gradient(rgba(255,255,255,.75),rgba(255,255,255,0) 70%); animation:rip .65s var(--out) forwards}
@keyframes rip{from{transform:scale(0); opacity:1} to{transform:scale(42); opacity:0}}

/* ---------- 全体 ---------- */
.app{max-width:980px; margin:0 auto; padding:calc(8px + env(safe-area-inset-top)) 12px calc(128px + env(safe-area-inset-bottom))}

.top{
  position:sticky; top:calc(8px + env(safe-area-inset-top)); z-index:30;
  display:flex; align-items:center; gap:12px; padding:10px; border-radius:28px;
  transition:padding .5s var(--spring), border-radius .5s var(--spring);
}
.avatar{width:52px; height:52px; border-radius:50%; flex:none; object-fit:cover; background:#fff;
  box-shadow:0 0 0 2px var(--rim-hi), 0 6px 16px -6px rgba(20,30,60,.4); transition:width .5s var(--spring), height .5s var(--spring)}
.top h1{margin:0; min-width:0; font-size:16px; font-weight:800; letter-spacing:-.01em; line-height:1.2; transition:font-size .4s var(--out); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top h1 em{font-style:normal; display:inline-grid; place-items:center; width:1.25em; height:1.25em; margin:0 .08em; border-radius:.32em; font-size:.82em; vertical-align:.08em;
  background:var(--fill-3); box-shadow:inset 0 1px 0 var(--rim-hi), inset 0 -1.5px 0 rgba(0,0,0,.08), 0 2px 6px -2px rgba(20,30,60,.35)}
.follow{margin-left:auto; flex:none; display:grid; place-items:center; width:42px; height:42px; border-radius:50%}
.follow svg{width:22px; height:22px}
.top.compact{padding:6px 6px 6px 8px; border-radius:24px}
.top.compact .avatar{width:36px; height:36px}
.top.compact h1{font-size:15px}
.top.compact .follow{width:36px; height:36px}
@media (min-width:420px){ .top h1{font-size:18px} }

.pr{display:flex; align-items:center; gap:7px; margin:12px 6px 0; font-size:11px; color:var(--ink-2)}
.pr b{font-size:9.5px; letter-spacing:.06em; padding:2px 6px; border-radius:6px; background:var(--ink); color:var(--bg)}

.head{display:flex; align-items:center; gap:8px; margin:22px 4px 10px}
.head h2{margin:0; font-size:22px; font-weight:800; letter-spacing:-.02em}
.count{font:700 13px var(--mono); color:var(--ink-3); font-variant-numeric:tabular-nums}
.more{margin-left:auto; height:32px; padding:0 13px; border:0; border-radius:16px; font-size:12.5px; font-weight:800; color:var(--blue)}

.view[hidden]{display:none}
.view.leaving{animation:view-out .18s ease-in forwards}
.view.entering{animation:view-in .55s var(--soft) backwards}
@keyframes view-out{to{opacity:0; transform:translateX(calc(var(--dir,1) * -24px)) scale(.985)}}
@keyframes view-in{from{opacity:0; transform:translateX(calc(var(--dir,1) * 32px)) scale(.985)}}

/* ---------- クーポン ---------- */
.rail{display:grid; grid-auto-flow:column; grid-auto-columns:min(80%,310px); gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  scroll-padding:0 12px; padding:6px 12px 18px; margin:0 -12px; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
@supports (animation-timeline: view()){
  .rail>.cc{animation:rail-depth linear both; animation-timeline:view(inline); animation-range:cover}
  @keyframes rail-depth{0%{transform:scale(.9) rotateY(-8deg); opacity:.6} 30%,70%{transform:none; opacity:1} 100%{transform:scale(.9) rotateY(8deg); opacity:.6}}
}
.cc{display:flex; flex-direction:column; gap:12px; padding:14px; border-radius:28px; text-align:left; border:0; width:100%}
.cc-top{display:flex; align-items:center; gap:10px; min-width:0}
.stack{display:flex; flex:none}
.stack img,.stack .logo{width:40px; height:40px; border-radius:13px; background:#fff; object-fit:contain; box-shadow:0 0 0 2px var(--rim-hi), 0 4px 10px -4px rgba(20,30,60,.35)}
.stack img+img{margin-left:-14px}
.stack .logo{display:grid; place-items:center; padding:6px; width:64px}
.stack .logo img{width:100%; height:100%; object-fit:contain; box-shadow:none; border-radius:0}
.cc-name{min-width:0}
.cc-maker{font-weight:800; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cc-n{font-size:11px; color:var(--ink-3); font-weight:600}
.left{margin-left:auto; flex:none; font-size:11px; font-weight:800; padding:5px 9px; border-radius:99px; background:rgba(255,159,10,.17); color:var(--amber-ink)}
.left.hot{background:rgba(229,40,30,.13); color:var(--hot)}
.cc-off{font-size:32px; font-weight:900; letter-spacing:-.035em; line-height:1}
.cc-off small{font-size:15px; font-weight:800; letter-spacing:0; margin-left:2px}
.keys{display:grid; gap:6px}
.rail .cc .keys{margin-top:auto}
.keylabel{font-size:10.5px; font-weight:700; color:var(--ink-3); margin:2px 0 -2px 4px}
.key{position:relative; display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; height:48px; padding:0 7px 0 14px;
  border:0; border-radius:17px; font:800 16px var(--mono); letter-spacing:.06em; color:var(--ink); text-align:left;
  background:var(--fill-3); box-shadow:inset 0 1px 0 var(--rim-hi), inset 0 -2px 0 rgba(0,0,0,.07), 0 6px 14px -8px rgba(20,30,60,.4)}
.key.long{font-size:12.5px; letter-spacing:.02em}
.key .code{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.key .kc{flex:none; display:flex; align-items:center; gap:5px; height:34px; padding:0 11px; border-radius:12px; font:800 11.5px -apple-system,"Hiragino Sans",sans-serif; letter-spacing:0;
  background:var(--ink); color:var(--bg); transition:background .35s, transform .5s var(--spring)}
.key .kc svg{width:14px; height:14px}
.key.copied .kc{background:var(--green); color:#fff; transform:scale(1.06)}
.cc-text{font-size:12px; line-height:1.7; color:var(--ink-2); white-space:pre-line; margin:0}
.cc-items{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -2px; padding:2px}
.cc-items button{flex:none; display:flex; align-items:center; gap:8px; max-width:220px; padding:5px 12px 5px 5px; border:0; border-radius:16px; font-size:12px; font-weight:700; text-align:left}
.cc-items img{width:34px; height:34px; border-radius:11px; background:#fff; object-fit:contain; flex:none}
.cc-items span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.clist{display:grid; grid-template-columns:minmax(0,1fr); gap:12px}
.cc{min-width:0}

/* ---------- カテゴリ（液体のレンズが滑る） ---------- */
.chipbar{position:sticky; top:calc(env(safe-area-inset-top) + 8px + 50px + 8px); z-index:20; border-radius:24px; padding:5px; margin:0 0 12px}
.chips{position:relative; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; border-radius:19px}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative; z-index:1; flex:none; border:0; background:none; height:38px; padding:0 15px; border-radius:19px; font-size:13.5px; font-weight:700; color:var(--ink-2); transition:color .3s}
.chip[aria-pressed="true"]{color:var(--ink)}
.lens{position:absolute; top:0; left:0; height:100%; width:0; border-radius:19px; z-index:0; pointer-events:none;
  background:var(--fill-3); box-shadow:inset 0 1px 0 var(--rim-hi), inset 0 0 0 .5px var(--edge), 0 3px 12px -3px rgba(20,30,60,.28);
  transform:translateX(var(--x,0px)) scale(var(--sx,1),var(--sy,1));
  transition:transform .55s var(--spring), width .55s var(--spring)}
.lens.stretch{transition:transform .2s var(--out), width .2s var(--out)}
.searching-on .chipbar{opacity:.45; pointer-events:none; filter:saturate(.5)}

/* ---------- 商品カード ---------- */
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; transition:opacity .16s}
.grid.out{opacity:0}
.card{display:flex; flex-direction:column; gap:6px; padding:7px 7px 12px; border:0; border-radius:26px; text-align:left; min-width:0}
.thumb{position:relative; display:block; aspect-ratio:1; border-radius:20px; background:#fff; overflow:hidden}
.thumb img{width:100%; height:100%; object-fit:contain; opacity:0; transform:scale(1.08); transition:opacity .5s, transform .9s var(--out)}
.thumb.ok img{opacity:1; transform:none}
.thumb:not(.ok)::after,.vt:not(.ok)::after,.sk::after{content:""; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--sk-hi),transparent); animation:shimmer 1.25s ease-in-out infinite}
.thumb .ini{position:absolute; inset:0; display:grid; place-items:center; font-size:34px; font-weight:900; color:#C9CFDA}
.badges{position:absolute; top:13px; left:13px; z-index:2; display:flex; gap:4px}
.b{font-size:10px; font-weight:800; padding:4px 8px; border-radius:99px; color:#fff; letter-spacing:.02em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 4px 10px -4px rgba(0,0,0,.35)}
.b.coupon{background:rgba(255,149,0,.92)}
.b.cf{background:rgba(162,75,214,.92)}
.meta{display:flex; justify-content:space-between; gap:6px; padding:2px 5px 0; font-size:11px; color:var(--ink-3); font-weight:600}
.meta .maker{font-weight:800; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta .date{font-family:var(--mono); flex:none}
.card .title{padding:0 5px; font-size:13.5px; font-weight:700; line-height:1.38; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .price{margin-top:auto; padding:0 5px; font:800 13px var(--mono)}
.empty{padding:40px 0; text-align:center; color:var(--ink-2); font-size:14px}

.reveal{opacity:0}
.reveal.in{opacity:1; animation:rise .75s var(--out) var(--d,0ms) backwards}
@keyframes rise{
  0%{opacity:0; transform:translateY(26px) scale(.93); filter:blur(8px)}
  65%{opacity:1; transform:translateY(-3px) scale(1.01); filter:blur(0)}
  100%{transform:none}
}

/* ---------- 動画 ---------- */
.vgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.vt{position:relative; display:block; aspect-ratio:9/16; padding:0; border:0; border-radius:26px; overflow:hidden; background:#151820; box-shadow:var(--drop); text-align:left}
.vt .frame{position:absolute; top:0; left:50%; height:100%; width:auto; max-width:none; transform:translateX(-50%) scale(1.06); opacity:0; transition:opacity .6s, transform 1s var(--out)}
.vt.ok .frame{opacity:1; transform:translateX(-50%)}
.vdate{position:absolute; top:10px; left:10px; z-index:2; padding:5px 9px; border-radius:99px; font:800 11px var(--mono)}
.vcount{position:absolute; top:10px; right:10px; z-index:2; padding:5px 9px; border-radius:99px; font-size:11px; font-weight:800}
.vinfo{position:absolute; left:7px; right:7px; bottom:7px; z-index:2; display:flex; flex-direction:column; gap:7px; padding:9px; border-radius:20px}
.vthumbs{display:flex}
.vthumbs img{width:30px; height:30px; border-radius:10px; background:#fff; object-fit:contain; box-shadow:0 0 0 1.5px rgba(255,255,255,.8)}
.vthumbs img+img{margin-left:-8px}
.vtitle{font-size:12px; font-weight:800; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.play{position:absolute; top:50%; left:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; display:grid; place-items:center; z-index:2; transition:transform .5s var(--spring)}
.play svg{width:22px; height:22px; margin-left:3px}
.vt:hover .play{transform:scale(1.1)}

/* ---------- フッター ---------- */
.foot{margin-top:34px; display:grid; gap:14px; justify-items:center; text-align:center}
.work{display:grid; gap:2px; width:100%; padding:16px; border-radius:24px}
.work span{font-size:12px; font-weight:700; color:var(--ink-2)}
.work b{font-size:15px; font-weight:800; word-break:break-all}
.social{display:flex; gap:10px}
.social a{width:48px; height:48px; border-radius:50%; display:grid; place-items:center}
.social svg{width:22px; height:22px; fill:currentColor}
.fine{margin:4px 0 0; font-size:11px; line-height:1.8; color:var(--ink-3)}

/* ---------- 下のドック（タブ＋検索） ---------- */
.dock{position:fixed; z-index:50; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); width:min(440px,calc(100% - 20px)); display:flex; gap:8px;
  transform:translateX(-50%); transition:transform .5s var(--spring)}
.dock.mini{transform:translateX(-50%) translateY(8px) scale(.93)}
.tabbar{flex:1 1 0; min-width:64px; height:64px; padding:4px; border-radius:32px; display:flex; transition:flex-grow .55s var(--spring)}
.tab{position:relative; z-index:1; flex:1; min-width:0; border:0; background:none; border-radius:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:10.5px; font-weight:800; color:var(--ink-2); transition:color .3s}
.tab svg{width:25px; height:25px; transition:transform .5s var(--spring)}
.tab[aria-selected="true"]{color:var(--blue)}
.tab[aria-selected="true"] svg{transform:scale(1.08)}
.tabbar .lens{border-radius:28px; top:4px; height:calc(100% - 8px)}
.dock.mini .tab span{opacity:.0}
.tab span{transition:opacity .25s}
.searchbox{flex:0 0 64px; height:64px; border-radius:32px; display:flex; align-items:center; overflow:hidden; transition:flex-grow .55s var(--spring), flex-basis .55s var(--spring)}
.sbtn{flex:none; width:64px; height:64px; border:0; background:none; display:grid; place-items:center; border-radius:50%}
.sbtn svg{width:24px; height:24px}
.searchbox input{flex:1; min-width:0; height:100%; border:0; background:none; outline:none; font-size:16px; font-weight:700; color:var(--ink); opacity:0; transition:opacity .3s .12s}
.searchbox input::placeholder{color:var(--ink-3)}
.sclear{flex:none; width:40px; height:40px; margin-right:12px; border:0; border-radius:50%; background:var(--fill-3); display:none; place-items:center}
.sclear svg{width:16px; height:16px}
.dock.searching .tabbar{flex-grow:0; flex-basis:64px}
.dock.searching .tab:not([aria-selected="true"]),.dock.searching .tabbar .lens,.dock.searching .tab span{display:none}
.dock.searching .searchbox{flex:1 1 0}
.dock.searching .searchbox input{opacity:1}
.dock.searching .sclear{display:grid}

/* ---------- 下から出るシート ---------- */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(8,12,28,.30); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); opacity:0; transition:opacity .35s; view-transition-name:scrim}
.scrim.open{opacity:1}
.sheet{position:fixed; z-index:70; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto;
  max-height:min(88vh,880px); overflow-y:auto; overscroll-behavior:contain; border-radius:36px; padding:0 18px 22px; outline:none;
  transform:translateY(calc(100% + 30px)); transition:transform .6s var(--spring); view-transition-name:sheet; scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.glass{background:linear-gradient(165deg,var(--fill-3),var(--fill-2) 70%)}
.sheet.open{transform:none}
.sheet.instant,.sheet.dragging{transition:none}
.grab{position:sticky; top:0; z-index:5; height:34px; margin:0 -18px; display:grid; place-items:center; cursor:grab; touch-action:none;
  background:linear-gradient(var(--fill-3) 40%,transparent)}
.grab i{width:40px; height:5px; border-radius:3px; background:var(--ink-3)}
.sclose{position:absolute; right:12px; top:10px; width:36px; height:36px; border:0; border-radius:50%; display:grid; place-items:center}
.sclose svg{width:15px; height:15px}
.s-body{transition:opacity .16s, transform .3s var(--out)}
.s-body.swap{opacity:0; transform:translateY(8px)}
.s-thumb{position:relative; display:block; width:min(60vw,236px); aspect-ratio:1; margin:6px auto 16px; border-radius:30px; background:#fff; overflow:hidden; box-shadow:var(--drop)}
.s-thumb img{width:100%; height:100%; object-fit:contain}
.s-meta{display:flex; gap:8px; align-items:center; font-size:12px; font-weight:700; color:var(--ink-3)}
.s-meta .maker{color:var(--ink-2); font-weight:800}
.s-meta .price{margin-left:auto; font:800 15px var(--mono); color:var(--ink)}
.s-title{margin:6px 0 8px; font-size:20px; font-weight:800; line-height:1.4; letter-spacing:-.01em}

  background:linear-gradient(150deg,rgba(255,159,10,.20),rgba(255,159,10,.06)); box-shadow:inset 0 0 0 1px rgba(255,159,10,.32)}

.btn{position:relative; display:flex; align-items:center; justify-content:center; gap:8px; height:54px; border-radius:19px; font-weight:800; font-size:15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.08), 0 8px 18px -10px rgba(20,30,60,.5)}
.btn svg{width:18px; height:18px}
.btn.amazon{background:linear-gradient(180deg,rgba(255,184,62,.96),rgba(255,153,0,.92)); color:#1A1206}
.btn.rakuten{background:linear-gradient(180deg,rgba(214,22,22,.94),rgba(191,0,0,.92)); color:#fff}
.btn.web{background:var(--fill-3); color:var(--ink)}

.rel{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px; margin:0 -2px}
.rel button{flex:none; width:92px; border:0; background:none; padding:0; text-align:left; display:grid; gap:6px}
.rel .rt{aspect-ratio:1; border-radius:20px; background:#fff; overflow:hidden; box-shadow:var(--drop)}
.rel .rt img{width:100%; height:100%; object-fit:contain}
.rel span{font-size:11px; font-weight:700; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.player{position:relative; width:min(66vw,280px); aspect-ratio:9/16; margin:6px auto 16px; border-radius:30px; overflow:hidden; background:#000; box-shadow:var(--drop)}
.player .frame{position:absolute; top:0; left:50%; height:100%; width:auto; max-width:none; transform:translateX(-50%)}
.player iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.player .play{width:64px; height:64px; margin:-32px 0 0 -32px; border:0}
.rows{display:grid; gap:8px}
.row{display:flex; align-items:center; gap:12px; padding:7px 12px 7px 7px; border:0; border-radius:20px; text-align:left; width:100%}
.row img{width:56px; height:56px; border-radius:15px; background:#fff; object-fit:contain; flex:none}

.row .chev{margin-left:auto; flex:none; color:var(--ink-3)}

/* ---------- 通知 ---------- */
.toast{position:fixed; z-index:90; left:50%; top:calc(14px + env(safe-area-inset-top)); display:flex; align-items:center; gap:8px; padding:11px 18px 11px 12px; border-radius:99px;
  font-size:13.5px; font-weight:800; white-space:nowrap; transform:translate(-50%,-140%) scale(.8); opacity:0; transition:transform .6s var(--spring), opacity .3s; pointer-events:none}
.toast.show{transform:translate(-50%,0) scale(1); opacity:1}
.toast i{width:24px; height:24px; border-radius:50%; background:var(--green); display:grid; place-items:center; color:#fff}
.toast i svg{width:14px; height:14px}
.toast code{font-family:var(--mono); font-weight:800}

/* ---------- 全画面スケルトン ---------- */
.skel{position:fixed; inset:0; z-index:100; overflow:hidden; pointer-events:none; transition:opacity .6s var(--out), filter .6s var(--out), transform .7s var(--out)}
.skel-in{max-width:980px; margin:0 auto; padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.sk{position:relative; overflow:hidden; display:block; background:var(--sk); border-radius:10px}
.skg{position:relative; overflow:hidden; background:linear-gradient(160deg,var(--fill-2),var(--fill)); box-shadow:inset 0 1px 0 var(--rim-hi), inset 0 0 0 .5px var(--edge), var(--drop)}
.sk-top{display:flex; align-items:center; gap:12px; padding:10px; border-radius:28px}

.sk-top .ln{flex:1; display:grid; gap:7px}
.sk-pr{width:62%; height:10px; margin:16px 6px 0}
.sk-h{width:120px; height:22px; margin:24px 4px 12px}
.sk-rail{display:grid; grid-auto-flow:column; grid-auto-columns:min(80%,310px); gap:12px}
.sk-cc{border-radius:28px; padding:14px; display:grid; gap:12px}
.sk-cc .r{display:flex; gap:10px; align-items:center}
.sk-chips{display:flex; gap:8px; padding:9px; border-radius:24px; margin:18px 0 12px}
.sk-chips .sk{width:64px; height:30px; border-radius:15px; flex:none}
.sk-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.sk-card{border-radius:26px; padding:7px 7px 12px; display:grid; gap:8px}
.sk-card .sq{aspect-ratio:1; border-radius:20px}
.sk-dock{position:fixed; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(440px,calc(100% - 20px)); display:flex; gap:8px}
.sk-dock .t{flex:1; height:64px; border-radius:32px}
.sk-dock .s{width:64px; height:64px; border-radius:50%}
@keyframes shimmer{to{transform:translateX(100%)}}
body.ready .skel{opacity:0; filter:blur(10px); transform:scale(1.03)}

body:not(.ready) .app,body:not(.ready) .dock{opacity:0}
body.ready .top{animation:in-down .9s var(--spring) backwards}
body.ready .pr{animation:fade .6s .12s backwards}
body.ready #view-items .head{animation:fade .6s .15s backwards}
body.ready .rail>*{animation:in-right .85s var(--soft) backwards; animation-delay:calc(var(--i,0) * 80ms + 140ms)}
body.ready .chipbar{animation:in-up .8s var(--spring) .22s backwards}
body.ready .dock{animation:dock-in 1s var(--spring) .3s backwards}
@keyframes in-down{from{opacity:0; transform:translateY(-26px) scale(.96)}}
@keyframes in-up{from{opacity:0; transform:translateY(20px) scale(.97)}}
@keyframes in-right{from{opacity:0; transform:translateX(60px) scale(.94)}}
@keyframes fade{from{opacity:0}}
@keyframes dock-in{from{opacity:0; transform:translateX(-50%) translateY(90px) scale(.8)}}

/* シートの出入り（対応ブラウザでは写真がカードからそのまま浮き上がる） */
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(hero){animation-duration:.6s; animation-timing-function:cubic-bezier(.3,1.2,.4,1)}
::view-transition-group(sheet){animation-duration:.6s}
::view-transition-new(sheet):only-child{animation:vt-sheet-in .6s var(--soft)}
::view-transition-old(sheet):only-child{animation:vt-sheet-out .38s cubic-bezier(.5,0,.75,0) forwards}
@keyframes vt-sheet-in{from{transform:translateY(105%)}}
@keyframes vt-sheet-out{to{transform:translateY(105%)}}

function moveLens(lens, target, instant) {
  const x = target.offsetLeft, w = target.offsetWidth;
  const set = (x, w) => { lens.style.setProperty("--x", x + "px"); lens.style.width = w + "px"; lens.dataset.x = x; lens.dataset.w = w; };
  if (instant || reduce || !lens.dataset.w) { lens.style.transition = "none"; set(x, w); lens.offsetWidth; lens.style.transition = ""; return; }
  const px = +lens.dataset.x, pw = +lens.dataset.w;
  const ux = Math.min(px, x), uw = Math.max(px + pw, x + w) - ux;
  clearTimeout(lens._t);
  lens.classList.add("stretch");
  lens.style.setProperty("--sy", ".84");
  set(ux, uw);
  lens._t = setTimeout(() => {
    lens.classList.remove("stretch");
    lens.style.setProperty("--sy", "1");
    set(x, w);
  }, 170);
}

  old.style.setProperty("--dir", dir);
  old.classList.add("leaving");
  setTimeout(() => {

    old.classList.remove("leaving");
    next.hidden = false;
    next.style.setProperty("--dir", dir);
    next.classList.remove("entering");
    void next.offsetWidth;
    next.classList.add("entering");
    window.scrollTo(0, 0);
    observe(next);

    <div class="s-meta"><span>${md(g.date)} 公開</span><span>${g.items.length}点を紹介</span></div>
    <h2 class="s-title">${esc(videoTitle(g))}</h2>
    <div class="rows">${g.items.map((it) => `<button class="row pane press" type="button" data-item="${it.id}"><img src="${src(it.thumbnail)}" alt=""><span class="rtx"><b>${esc(it.title)}</b><small>${esc(it.maker)}${it.priceText ? " · " + esc(it.priceText) : ""}</small></span><span class="chev">${ICON.chev}</span></button>`).join("")}</div>
    <div class="buy"><a class="btn yt press" href="${esc(g.yt)}" target="_blank" rel="noopener">${ICON.play}YouTubeで開く</a></div>`;
}

function couponSheet(c) {
  if (c.logo) {
    return `<div class="moft-big"><img src="${c.logo}" alt="MOFT"></div>
      <div class="s-meta"><span class="maker">${esc(c.scope)}</span>${leftChip(c.expires)}</div>
      <h2 class="s-title">${esc(c.off)}${esc(c.offUnit)}</h2>
      <div class="keys">${c.codes.map((k) => keyHTML(k, false)).join("")}</div>
      <ul class="terms">${c.terms.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
      <div class="buy"><a class="btn web press" href="${c.url}" target="_blank" rel="noopener sponsored">MOFT公式サイト${ICON.out}</a></div>`;
  }
  return `<div class="s-meta" style="margin-top:6px"><span class="maker">${esc(c.maker)}</span>${leftChip(c.expires)}</div>
    <h2 class="s-title">${esc(c.off)}${esc(c.offUnit)}</h2>
    <div class="keys">${c.codes.map((k) => keyHTML(k, c.codes.length > 1)).join("")}</div>
    <p class="cc-text" style="margin-top:12px">${esc(c.text)}</p>
    <p class="s-sub">対象の商品</p>
    <div class="rows">${c.items.map((it) => `<button class="row pane press" type="button" data-item="${it.id}"><img src="${src(it.thumbnail)}" alt=""><span class="rtx"><b>${esc(it.title)}</b><small>${esc(it.maker)}${it.priceText ? " · " + esc(it.priceText) : ""}</small></span><span class="chev">${ICON.chev}</span></button>`).join("")}</div>`;
}

function openSheet(html, thumbEl) {
  if (!sheet.hidden) { swapSheet(html); return; }
  lastFocus = document.activeElement;
  const show = () => {
    sbody.innerHTML = html;
    sheet.hidden = false;
    scrim.hidden = false;
    sheet.scrollTop = 0;
    document.documentElement.classList.add("locked");
  };
  if (thumbEl && canVT()) {
    fromThumb = thumbEl;
    thumbEl.style.viewTransitionName = "hero";
    sheet.classList.add("instant");
    const vt = document.startViewTransition(() => {
      thumbEl.style.viewTransitionName = "";
      show();
      sheet.classList.add("open");
      scrim.classList.add("open");
      const h = $(".s-thumb", sheet);
      if (h) h.style.viewTransitionName = "hero";
    });
    vt.finished.finally(() => { const h = $(".s-thumb", sheet); if (h) h.style.viewTransitionName = ""; sheet.classList.remove("instant"); });
  } else {
    fromThumb = null;
    show();
    requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add("open"); scrim.classList.add("open"); }));
  }
  setTimeout(() => sheet.focus({ preventScroll: true }), 60);
}

function swapSheet(html) {
  fromThumb = null;
  sbody.classList.add("swap");
  sheet.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  setTimeout(() => { sbody.innerHTML = html; sbody.classList.remove("swap"); }, reduce ? 0 : 170);
}

function closeSheet() {
  if (sheet.hidden) return;
  const finish = () => {
    sheet.hidden = true; scrim.hidden = true;
    sheet.classList.remove("open", "dragging"); scrim.classList.remove("open");
    sheet.style.transform = "";
    sbody.innerHTML = "";
    document.documentElement.classList.remove("locked");
  };
  const t = fromThumb;
  const r = t && t.getBoundingClientRect();
  if (t && canVT() && r.bottom > 0 && r.top < innerHeight && !sheet.classList.contains("dragging")) {
    const h = $(".s-thumb", sheet);
    if (h) h.style.viewTransitionName = "hero";
    sheet.classList.add("instant");
    const vt = document.startViewTransition(() => { if (h) h.style.viewTransitionName = ""; finish(); t.style.viewTransitionName = "hero"; });
    vt.finished.finally(() => { t.style.viewTransitionName = ""; sheet.classList.remove("instant"); });
  } else {
    sheet.classList.remove("dragging");
    sheet.style.transform = "";
    sheet.classList.remove("open"); scrim.classList.remove("open");
    setTimeout(finish, reduce ? 0 : 420);
  }
  fromThumb = null;
  lastFocus?.focus?.({ preventScroll: true });
}
scrim.addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !sheet.hidden) closeSheet();
  if (e.key === "Enter" && e.target.matches("[data-coupon]")) e.target.click();
});

/* 引っぱって閉じる */
(() => {
  const grab = $("#grab");
  let y0 = null, dy = 0;
  grab.addEventListener("pointerdown", (e) => { if (e.target.closest("[data-close]")) return; y0 = e.clientY; dy = 0; grab.setPointerCapture(e.pointerId); sheet.classList.add("dragging"); });
  grab.addEventListener("pointermove", (e) => {
    if (y0 == null) return;
    dy = e.clientY - y0;
    const d = dy > 0 ? dy : -Math.sqrt(-dy) * 2;
    sheet.style.transform = `translateY(${d}px)`;
    scrim.style.opacity = Math.max(0.2, 1 - dy / 500);
  });
  const end = () => {
    if (y0 == null) return;
    y0 = null; scrim.style.opacity = "";
    if (dy > 110) { closeSheet(); return; }
    sheet.classList.remove("dragging");
    sheet.style.transform = "";
  };
  grab.addEventListener("pointerup", end);
  grab.addEventListener("pointercancel", end);
})();

/* ---------- コピー ---------- */
const toast = $("#toast");
let toastT;
function showToast(code) {
  toast.innerHTML = `<i>${ICON.check}</i>コピーしました <code>${esc(code)}</code>`;
  toast.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => toast.classList.remove("show"), 1800);
}
async function copy(code, btn) {
  try { await navigator.clipboard.writeText(code); }
  catch {
    const ta = Object.assign(document.createElement("textarea"), { value: code });
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  navigator.vibrate?.(10);
  $$(`[data-copy="${CSS.escape(code)}"]`).forEach((b) => {
    b.classList.add("copied");
    $(".kc b", b).textContent = "済み";
    $(".kc", b).firstElementChild.outerHTML = ICON.check;
    setTimeout(() => { b.classList.remove("copied"); $(".kc b", b).textContent = "コピー"; $(".kc", b).firstElementChild.outerHTML = ICON.copy; }, 2200);
  });
  showToast(code);
}

/* ---------- タップの振り分け ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-copy],[data-item],[data-video],[data-coupon],[data-view],[data-cat],[data-close],[data-play]");
  if (!el) return;
  const d = el.dataset;
  if (d.copy) return copy(d.copy, el);
  if (d.close !== undefined) return closeSheet();
  if (d.play) { $("#player").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${d.play}?autoplay=1&playsinline=1&rel=0" title="紹介動画" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; return; }
  if (d.item) { const it = byId[d.item]; return openSheet(itemSheet(it), sheet.hidden ? $(".thumb", el) : null); }
  if (d.video) return openSheet(videoSheet(videoById[d.video]));
  if (d.coupon) return openSheet(couponSheet(couponByKey[d.coupon]));
  if (d.view) { if (dock.classList.contains("searching")) closeSearch(); return setView(d.view); }
  if (d.cat) return setCat(d.cat);
});

/* 光の映り込みと波紋 */
document.addEventListener("pointermove", (e) => {
  const g = e.target.closest?.(".glass,.pane");
  if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty("--mx", e.clientX - r.left + "px");
  g.style.setProperty("--my", e.clientY - r.top + "px");
  if (!g.classList.contains("lit")) {
    $$(".lit").forEach((x) => x !== g && x.classList.remove("lit"));
    g.classList.add("lit");
  }
}, { passive: true });
document.addEventListener("pointerleave", () => $$(".lit").forEach((x) => x.classList.remove("lit")));
document.addEventListener("pointerdown", (e) => {
  if (reduce) return;
  const p = e.target.closest(".press");
  if (!p) return;
  const r = p.getBoundingClientRect();
  const s = document.createElement("span");
  s.className = "rip";
  s.style.left = e.clientX - r.left + "px";
  s.style.top = e.clientY - r.top + "px";
  if (getComputedStyle(p).position === "static") p.style.position = "relative";
  p.append(s);
  setTimeout(() => s.remove(), 700);
}, { passive: true });

/* スクロールで上の帯を小さく、下のドックを縮める */
let lastY = scrollY, ticking = false;
addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = scrollY;
    $("#top").classList.toggle("compact", y > 24);
    if (Math.abs(y - lastY) > 6) dock.classList.toggle("mini", y > lastY && y > 120 && !dock.classList.contains("searching"));
    lastY = y;
    ticking = false;
  });
}, { passive: true });
addEventListener("resize", () => placeLenses(true));

/* ---------- 起動：スケルトン → 本体 ---------- */
const t0 = performance.now();
renderStatic();
renderGrid(false);
const firstImgs = $$("#grid img").slice(0, 8).concat($$("#rail img").slice(0, 4), [$(".avatar")]);
Promise.race([
  Promise.all(firstImgs.map((im) => (im.complete ? 0 : new Promise((r) => { im.addEventListener("load", r, { once: true }); im.addEventListener("error", r, { once: true }); })))),
  new Promise((r) => setTimeout(r, 2800)),
]).then(() => {
  setTimeout(() => {
    ready = true;
    document.body.classList.add("ready");
    placeLenses(true);
    observe(document);
    setTimeout(() => $("#skeleton").remove(), 800);
  }, Math.max(0, 800 - (performance.now() - t0)));
});
})();
</script>
